# Generic parallel render workflow: split frames into chunks, render them in parallel, join them.
name: ferme
on:
  push:
    branches: ['ferme/**']
permissions: { contents: write }
concurrency: { group: 'ferme-${{ github.ref }}', cancel-in-progress: true }
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: { matrice: '${{ steps.m.outputs.matrice }}', ref: '${{ steps.r.outputs.ref }}', id: '${{ steps.r.outputs.id }}' }
    steps:
      - id: r
        env: { K: '${{ secrets.KIT_TOKEN }}' }
        run: |
          ID="${GITHUB_REF#refs/heads/ferme/}"; REF="ferme/$ID"; [ -z "$K" ] || REF="ferme-pub/$ID"
          echo "id=$ID" >> $GITHUB_OUTPUT; echo "ref=$REF" >> $GITHUB_OUTPUT
      - id: m
        env: { K: '${{ secrets.KIT_TOKEN || github.token }}', P: '${{ secrets.KIT_TOKEN }}', REF: '${{ steps.r.outputs.ref }}' }
        run: |
          R="$GITHUB_REPOSITORY"; [ -z "$P" ] || R=$(curl -s -H "Authorization: Bearer $P" "https://api.github.com/user/repos?visibility=private&per_page=5" | python3 -c "import json,sys;print(json.load(sys.stdin)[0]['full_name'])")
          echo "::add-mask::$R"
          git clone -q --depth 1 --branch "$REF" --filter=blob:none --no-checkout "https://x-access-token:$K@github.com/$R.git" kit
          cd kit && git sparse-checkout set outils/ferme && git checkout -q
          echo "matrice=$(python3 outils/ferme/decouper.py FERME.json)" >> $GITHUB_OUTPUT
  morceau:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy: { fail-fast: false, max-parallel: 20, matrix: '${{ fromJSON(needs.plan.outputs.matrice) }}' }
    steps:
      - name: fetch
        env: { K: '${{ secrets.KIT_TOKEN || github.token }}', P: '${{ secrets.KIT_TOKEN }}', REF: '${{ needs.plan.outputs.ref }}' }
        run: |
          R="$GITHUB_REPOSITORY"; [ -z "$P" ] || R=$(curl -s -H "Authorization: Bearer $P" "https://api.github.com/user/repos?visibility=private&per_page=5" | python3 -c "import json,sys;print(json.load(sys.stdin)[0]['full_name'])")
          echo "::add-mask::$R"
          git clone -q --depth 1 --branch "$REF" --no-checkout "https://x-access-token:$K@github.com/$R.git" kit
          cd kit && git sparse-checkout set --no-cone '/*' '!/sons/' '!/archives/' && git checkout -q
      - run: sudo mkdir -p /home/claude/bpyenv && sudo chown -R "$USER" /home/claude
      - uses: actions/cache@v4
        with: { path: /home/claude/bpyenv, key: 'bpyenv-v1-${{ runner.os }}' }
      - run: bash kit/outils/ferme/installer.sh kit
      - run: bash kit/outils/ferme/morceau.sh kit/FERME.json ${{ matrix.f0 }} ${{ matrix.f1 }} seg
      - name: encrypt
        env: { K: '${{ secrets.KIT_TOKEN }}' }
        run: |
          cd seg; if [ -n "$K" ]; then for f in *.mp4; do openssl enc -aes-256-cbc -pbkdf2 -pass env:K -in "$f" -out "$f.enc" && rm "$f"; done; fi
      - uses: actions/upload-artifact@v4
        with: { name: 'seg-${{ matrix.f0 }}', path: seg/, retention-days: 1 }
  assemblage:
    needs: [plan, morceau]
    runs-on: ubuntu-latest
    steps:
      - name: fetch
        env: { K: '${{ secrets.KIT_TOKEN || github.token }}', P: '${{ secrets.KIT_TOKEN }}', REF: '${{ needs.plan.outputs.ref }}' }
        run: |
          R="$GITHUB_REPOSITORY"; [ -z "$P" ] || R=$(curl -s -H "Authorization: Bearer $P" "https://api.github.com/user/repos?visibility=private&per_page=5" | python3 -c "import json,sys;print(json.load(sys.stdin)[0]['full_name'])")
          echo "::add-mask::$R"
          git clone -q --depth 1 --branch "$REF" --no-checkout "https://x-access-token:$K@github.com/$R.git" kit
          cd kit && git sparse-checkout set --no-cone '/*' '!/archives/' && git checkout -q
      - uses: actions/download-artifact@v4
        with: { pattern: 'seg-*', path: seg, merge-multiple: true }
      - name: decrypt
        env: { K: '${{ secrets.KIT_TOKEN }}' }
        run: |
          cd seg; for f in *.enc; do [ -e "$f" ] || continue; openssl enc -d -aes-256-cbc -pbkdf2 -pass env:K -in "$f" -out "${f%.enc}" && rm "$f"; done
      - run: sudo mkdir -p /home/claude/bpyenv && sudo chown -R "$USER" /home/claude
      - uses: actions/cache/restore@v4
        with: { path: /home/claude/bpyenv, key: 'bpyenv-v1-${{ runner.os }}' }
      - run: bash kit/outils/ferme/installer.sh kit
      - run: bash kit/outils/ferme/assembler.sh kit/FERME.json seg video.mp4
      - name: deliver
        run: |
          cd kit; git config user.name ferme; git config user.email ferme@users.noreply.github.com
          B="rendus/${{ needs.plan.outputs.id }}"
          git checkout -q --orphan "$B"; git rm -rq --cached . ; cp ../video.mp4 video.mp4
          git add -f video.mp4; git commit -qm "$B"; git push -qf origin "HEAD:refs/heads/$B"; echo "done"
